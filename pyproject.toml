[project]
name = "video-analysis-gemini"
version = "1.0.0"
description = "Gemini-powered multimodal video production analysis pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["video-analysis", "gemini", "multimodal", "content-creation", "production-technique"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Content Creators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/andersyin/video-analysis-gemini"
Repository = "https://github.com/andersyin/video-analysis-gemini"
Issues = "https://github.com/andersyin/video-analysis-gemini/issues"

[tool.flake8]
max-line-length = 120
max-complexity = 20
